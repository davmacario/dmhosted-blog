name: PR Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build (fails on broken templates/shortcodes)
        run: hugo --minify --gc

      # - name: Check for broken links
      #   run: |
      #     curl -sSLo /tmp/ht.tar.gz \
      #       https://github.com/wjdp/htmltest/releases/download/v0.17.0/htmltest_0.17.0_linux_amd64.tar.gz
      #     tar -xzf /tmp/ht.tar.gz -C /tmp
      #     /tmp/htmltest -c .htmltest.yml public/

      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Verify image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.event.pull_request.number }}
          path: public/
          retention-days: 3

  release-preview:
    name: Preview next release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --no-ci is required: semantic-release otherwise bails out early on
      # pull_request events, before it ever analyses the commits.
      # --branches overrides the `main`-only config so the PR branch is allowed.
      - name: semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -o pipefail
          npx semantic-release --dry-run --no-ci --branches "$HEAD_REF" 2>&1 \
            | tee /tmp/semantic-release.log

      - name: Report next version
        if: always()
        run: |
          {
            echo "## Release preview"
            echo
            if [ -f .release-version ]; then
              echo "Merging this PR will publish **v$(cat .release-version)**."
            else
              echo "No release will be created"
            fi
            echo
            echo "<details><summary>semantic-release dry-run log</summary>"
            echo
            echo '```'
            cat /tmp/semantic-release.log 2>/dev/null || echo '(no log captured)'
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
