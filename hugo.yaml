baseURL: https://blog.dmhosted.com/
locale: en-us
title: Davide Macario's Blog
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

pagination:
  pagerSize: 10

minify:
  disableXML: true

params:
  env: production
  description: "I write about computers"
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false

  homeInfoParams:
    Title: "Davide Macario's Blog"
    Content: "These are just some of the cool things I play with"

  socialIcons:
    - name: github
      url: "https://github.com/davmacario"
    - name: linkedin
      url: "https://www.linkedin.com/in/davide-macario-b872b4225"

  footer:
    text: 'Content <a rel="license" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · Code <a href="https://github.com/davmacario/dmhosted-blog/blob/main/LICENSE">MIT</a>'

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: about
      name: About
      url: /about/about-me
      weight: 30

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
  goldmark:
    renderer:
      unsafe: true
